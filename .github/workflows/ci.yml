name: CI — Guardrails & Contract Verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  verify-guardrails:
    name: AST Security & Chaos Contract Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest

      - name: Run 14 AST Guardrail & Sandbox Unit Tests
        run: pytest -v

      - name: Verify 20 Chaos Scenarios Break Contracts Deterministically
        run: python -m benchmarks.chaos_generator
